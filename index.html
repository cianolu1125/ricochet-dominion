<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#111c27" />
    <meta
      name="description"
      content="弹射领地战争：同设备双人回合制策略游戏。用五座塔连接领地，通过弹射、中继与攻城争夺战场。"
    />
    <title>弹射领地战争 · v0.2.0</title>
  </head>
  <body>
    <main id="game">
      <div id="battlefield">
        <canvas
          id="board"
          tabindex="0"
          aria-label="弹射领地战场，选择移动或飞弹后从发光位置向后拖拽"
        ></canvas>
      </div>
      <div id="hud">
        <div id="round" class="pill"></div>
        <button id="help" class="icon-button" aria-label="查看游戏规则">
          ?</button
        ><button id="menu" class="icon-button" aria-label="对局设置">⋯</button>
        <div id="opponent" class="player-hud"></div>
        <div id="current" class="player-hud"></div>
        <div id="charge" class="pill" hidden></div>
        <div id="hint" role="status"></div>
        <div id="toast" role="status" hidden></div>
      </div>
      <div id="controls">
        <div id="stack" hidden></div>
        <div id="precision" hidden>
          <details>
            <summary>精确瞄准</summary>
            <label
              >角度 <output id="angle-value">0°</output
              ><input
                id="angle"
                type="range"
                min="-180"
                max="180"
                value="0" /></label
            ><label
              >力度 <output id="power-value">70%</output
              ><input
                id="power"
                type="range"
                min="8"
                max="100"
                value="70" /></label
            ><button id="precise-fire">发射</button>
          </details>
        </div>
        <button id="fab" class="fab">操作</button>
      </div>
      <div id="overlay">
        <section id="panel" aria-labelledby="panel-title"></section>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
